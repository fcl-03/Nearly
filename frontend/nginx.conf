server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads volumineux (selfie + pièce d'identité, jusqu'à ~10 Mo chacun côté backend).
    # Sans ça, nginx rejette toute requête > 1 Mo (défaut) avec un 413, avant même
    # d'atteindre le backend — d'où l'échec de la vérification d'identité.
    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /dev-static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
