# Configuration de PRODUCTION.
# Usage : docker compose -f docker-compose.prod.yml up -d --build
#
# Différences avec le dev :
#  - Caddy en façade = HTTPS automatique (Let's Encrypt)
#  - db / redis / backend / frontend NE sont PAS exposés sur l'hôte :
#    seul Caddy (80/443) est public, le reste passe par le réseau Docker interne.
#  - restart: unless-stopped pour que tout redémarre au reboot du serveur.
#  - Secrets et domaine injectés via le fichier .env (racine) — jamais versionné.
services:
  db:
    image: postgis/postgis:15-3.4
    container_name: nearly_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nearly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nearly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearly"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nearly_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nearly_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    volumes:
      - uploads_data:/app/dev_uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nearly_frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: nearly_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
